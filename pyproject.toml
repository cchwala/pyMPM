[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pympm"
version = "0.3.0"
description = "Python version of the MPM millimeter wave propagation model"
readme = "README.rst"
license = {text = "BSD"}
authors = [
    {name = "Christian Chwala", email = "christian.chwala@kit.edu"}
]
urls = {Homepage = "http://github.com/cchwala/pyMPM"}
keywords = ["microwave", "propagation", "atmosphere"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "tox",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
include = ["pyMPM*"]

[tool.setuptools.package-data]
pyMPM = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
